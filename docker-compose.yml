version: '2'
services:
  api:
    build: .
    # api and app run the same image. One shared tag stops Compose from
    # building and storing two copies of it.
    image: adbrew-test
    container_name: api
    command: bash -c "cd /src/rest && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    volumes:
      - ${ADBREW_CODEBASE_PATH}/tmp:/tmp
      - ${ADBREW_CODEBASE_PATH}:/src

  app:
    build: .
    image: adbrew-test
    container_name: app
    command: bash -c "cd /src/app && yarn install && yarn start"
    ports:
      - "3000:3000"
    environment:
      # The browser (on the host) calls the API, so this is a host URL.
      - REACT_APP_API_URL=http://localhost:8000
    volumes:
      - ${ADBREW_CODEBASE_PATH}:/src

  mongo:
    image: mongo:4.4
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - ${ADBREW_CODEBASE_PATH}/db/:/data/db
    command: mongod --bind_ip 0.0.0.0
